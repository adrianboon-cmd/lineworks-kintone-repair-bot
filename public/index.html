<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>設備報修</title>

  <link rel="stylesheet" href="/style.css">

  <!-- LINE WORKS WOFF SDK -->
  <script
    charset="utf-8"
    src="https://static.worksmobile.net/static/wm/woff/edge/3.7/sdk.js">
  </script>
</head>

<body>

  <main>

    <h1>🔧 設備報修</h1>

    <p>
      請填寫設備故障資訊
    </p>


    <!-- =========================
         LINE WORKS 使用者
    ========================== -->

    <div id="userSection">

      <div id="userLoading">
        正在取得 LINE WORKS 使用者資訊...
      </div>

      <div
        id="userInfo"
        style="display: none;"
      >
        👤 報修人：
        <strong id="displayUserName"></strong>
      </div>

      <div
        id="userError"
        style="display: none; color: #d93025;"
      >
      </div>

    </div>


    <!-- =========================
         報修表單
    ========================== -->

    <form id="repairForm">

      <label for="equipmentCategory">
        設備類別 *
      </label>

      <input
        id="equipmentCategory"
        name="equipmentCategory"
        type="text"
        required
      >


      <label for="equipmentNumber">
        設備編號
      </label>

      <input
        id="equipmentNumber"
        name="equipmentNumber"
        type="text"
      >


      <label for="equipmentName">
        設備名稱 *
      </label>

      <input
        id="equipmentName"
        name="equipmentName"
        type="text"
        required
      >


      <label for="location">
        所在位置 *
      </label>

      <input
        id="location"
        name="location"
        type="text"
        required
      >


      <label for="description">
        故障描述 *
      </label>

      <textarea
        id="description"
        name="description"
        required
      ></textarea>


      <label for="images">
        故障照片
      </label>

      <input
        id="images"
        name="images"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        capture="environment"
        multiple
      >

      <small>
        最多 3 張，每張最大 10 MB
      </small>


      <div id="imagePreview"></div>


      <button
        id="submitButton"
        type="submit"
        disabled
      >
        LINE WORKS 登入確認中...
      </button>

    </form>

  </main>


  <script src="/app.js"></script>

</body>

</html>
