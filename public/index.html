<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>設備報修</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

  <!-- LINE WORKS WOFF SDK -->

  <script
    charset="utf-8"
    src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"
  ></script>

</head>


<body>

  <main>

    <!-- =================================
         頁首
    ================================== -->

    <header class="app-header">

      <div class="header-top-row">

        <div>

          <h1>
            🔧
            <span data-i18n="app.title">
              設備報修
            </span>
          </h1>

          <p data-i18n="app.subtitle">
            LINE WORKS × kintone
          </p>

        </div>


        <!-- 語言選擇 -->

        <div class="language-selector">

          <label
            for="languageSelect"
            class="language-label"
          >
            🌐
          </label>

          <select
            id="languageSelect"
            aria-label="選擇語言"
          >

            <option value="zh-TW">
              繁體中文
            </option>

            <option value="ja-JP">
              日本語
            </option>

            <option value="en-US">
              English
            </option>

          </select>

        </div>

      </div>

    </header>


    <!-- =================================
         LINE WORKS 使用者資訊
    ================================== -->

    <section id="userSection">

      <div id="userLoading">
        正在取得 LINE WORKS 使用者資訊...
      </div>


      <div
        id="userInfo"
        style="display: none;"
      >

        👤

        <span data-i18n="common.applicant">
          申請人
        </span>：

        <strong id="displayUserName"></strong>

      </div>


      <div
        id="userError"
        style="display: none;"
      >
      </div>

    </section>


    <!-- =================================
         功能切換
    ================================== -->

    <nav
      id="navigation"
      class="navigation"
      style="display: none;"
    >

      <button
        id="createViewButton"
        class="navigation-button active"
        type="button"
      >

        🔧

        <span data-i18n="navigation.createRepair">
          我要報修
        </span>

      </button>


      <button
        id="myRepairsViewButton"
        class="navigation-button"
        type="button"
      >

        🔍

        <span data-i18n="navigation.myRepairs">
          案件查詢
        </span>

      </button>


      <button
        id="engineerViewButton"
        class="navigation-button"
        type="button"
      >

        👨‍🔧

        <span data-i18n="navigation.engineerTasks">
          維修任務
        </span>

      </button>

    </nav>


    <!-- =================================
         建立報修頁面
    ================================== -->

    <section
      id="createRepairView"
      class="view-section"
    >

      <div class="section-heading">

        <h2 data-i18n="repairForm.heading">
          建立報修
        </h2>

        <p data-i18n="repairForm.description">
          請填寫設備故障資訊
        </p>

      </div>


      <form id="repairForm">

        <!-- 設備類別 -->

        <label for="equipmentCategory">

          <span data-i18n="repairForm.equipmentCategory">
            設備類別
          </span>

          *

        </label>


        <select
          id="equipmentCategory"
          name="equipmentCategory"
          required
        >

          <option
            value=""
            data-i18n="repairForm.selectEquipmentCategory"
          >
            請選擇設備類別
          </option>

          <option value="辦公設備">
            辦公設備
          </option>

          <option value="電腦及資訊設備">
            電腦及資訊設備
          </option>

          <option value="網路及通訊設備">
            網路及通訊設備
          </option>

          <option value="生產設備">
            生產設備
          </option>

          <option value="空調及機電設備">
            空調及機電設備
          </option>

          <option value="門禁及監控設備">
            門禁及監控設備
          </option>

          <option value="其他">
            其他
          </option>

        </select>


        <!-- 設備編號 -->

        <label for="equipmentNumber">

          <span data-i18n="repairForm.equipmentNumber">
            設備編號
          </span>

        </label>


        <input
          id="equipmentNumber"
          name="equipmentNumber"
          type="text"
          placeholder="例如：MFP-001"
          data-i18n-placeholder="repairForm.equipmentNumberPlaceholder"
        >


        <!-- 設備名稱 -->

        <label for="equipmentName">

          <span data-i18n="repairForm.equipmentName">
            設備名稱
          </span>

          *

        </label>


        <input
          id="equipmentName"
          name="equipmentName"
          type="text"
          placeholder="例如：Apeos C3570"
          data-i18n-placeholder="repairForm.equipmentNamePlaceholder"
          required
        >


        <!-- 所在位置 -->

        <label for="location">

          <span data-i18n="repairForm.location">
            所在位置
          </span>

          *

        </label>


        <select
          id="location"
          name="location"
          required
        >

          <option
            value=""
            data-i18n="repairForm.selectLocation"
          >
            請選擇設備所在位置
          </option>


          <optgroup
            label="總公司"
            data-i18n-label="locations.headOffice"
          >

            <option value="總公司 6F 辦公室">
              總公司 6F 辦公室
            </option>

            <option value="總公司 7F 辦公室">
              總公司 7F 辦公室
            </option>

            <option value="總公司 公共區域">
              總公司 公共區域
            </option>

          </optgroup>


          <optgroup
            label="桃園廠"
            data-i18n-label="locations.taoyuanFactory"
          >

            <option value="桃園廠 產線 A">
              桃園廠 產線 A
            </option>

            <option value="桃園廠 產線 B">
              桃園廠 產線 B
            </option>

            <option value="桃園廠 倉庫">
              桃園廠 倉庫
            </option>

            <option value="桃園廠 辦公室">
              桃園廠 辦公室
            </option>

          </optgroup>


          <optgroup
            label="其他"
            data-i18n-label="locations.otherGroup"
          >

            <option value="其他">
              其他位置
            </option>

          </optgroup>

        </select>


        <!-- 故障描述 -->

        <label for="description">

          <span data-i18n="repairForm.faultDescription">
            故障描述
          </span>

          *

        </label>


        <textarea
          id="description"
          name="description"
          placeholder="請描述故障狀況，例如：列印時持續卡紙"
          data-i18n-placeholder="repairForm.faultDescriptionPlaceholder"
          required
        ></textarea>


        <!-- 故障照片 -->

        <label for="images">

          <span data-i18n="repairForm.faultPhoto">
            故障照片
          </span>

        </label>


        <input
          id="images"
          name="images"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          capture="environment"
          multiple
        >


        <small
          class="field-note"
          data-i18n="repairForm.photoNote"
        >
          最多 3 張，每張最大 10 MB
        </small>


        <div id="imagePreview"></div>


        <button
          id="submitButton"
          class="primary-button"
          type="submit"
          disabled
        >
          LINE WORKS 登入確認中...
        </button>

      </form>

    </section>


    <!-- =================================
         我的報修案件頁面
    ================================== -->

    <section
      id="myRepairsView"
      class="view-section"
      style="display: none;"
    >

      <div class="section-heading section-heading-row">

        <div>

          <h2 data-i18n="myRepairs.heading">
            我的報修案件
          </h2>

          <p data-i18n="myRepairs.description">
            查詢您所提出的設備報修
          </p>

        </div>


        <button
          id="refreshRepairsButton"
          class="refresh-button"
          type="button"
        >

          ↻

          <span data-i18n="common.refresh">
            重新整理
          </span>

        </button>

      </div>


      <!-- 查詢中 -->

      <div
        id="repairsLoading"
        class="state-message"
        style="display: none;"
        data-i18n="myRepairs.loading"
      >
        正在查詢報修案件...
      </div>


      <!-- 查詢錯誤 -->

      <div
        id="repairsError"
        class="state-message error-message"
        style="display: none;"
      >
      </div>


      <!-- 沒有案件 -->

      <div
        id="repairsEmpty"
        class="state-message empty-message"
        style="display: none;"
      >

        <div class="empty-icon">
          📭
        </div>


        <strong data-i18n="myRepairs.empty">
          目前沒有報修案件
        </strong>


        <p data-i18n="myRepairs.emptyDescription">
          若設備發生問題，可以點選「我要報修」建立案件。
        </p>

      </div>


      <!-- 案件清單 -->

      <div id="repairsList"></div>

    </section>


    <!-- =================================
         我的維修任務頁面
    ================================== -->

    <section
      id="engineerView"
      class="view-section"
      style="display: none;"
    >

      <div class="section-heading section-heading-row">

        <div>

          <h2 data-i18n="engineer.heading">
            我的維修任務
          </h2>


          <p data-i18n="engineer.description">
            查看並更新指派給您的維修案件
          </p>

        </div>


        <button
          id="refreshEngineerButton"
          class="refresh-button"
          type="button"
        >

          ↻

          <span data-i18n="common.refresh">
            重新整理
          </span>

        </button>

      </div>


      <div
        id="engineerLoading"
        class="state-message"
        style="display: none;"
        data-i18n="engineer.loading"
      >
        正在查詢維修任務...
      </div>


      <div
        id="engineerError"
        class="state-message error-message"
        style="display: none;"
      >
      </div>


      <div
        id="engineerEmpty"
        class="state-message empty-message"
        style="display: none;"
      >

        <div class="empty-icon">
          🧰
        </div>


        <strong data-i18n="engineer.empty">
          目前沒有指派給您的維修案件
        </strong>


        <p data-i18n="engineer.emptyDescription">
          kintone 指派案件後，任務會顯示在這裡。
        </p>

      </div>


      <div id="engineerRepairsList"></div>

    </section>


    <!-- =================================
         案件詳細資料視窗
    ================================== -->

    <div
      id="repairDetailModal"
      class="modal"
      style="display: none;"
    >

      <div class="modal-overlay"></div>


      <div class="modal-content">

        <div class="modal-header">

          <h2
            id="detailTitle"
            data-i18n="myRepairs.caseDetail"
          >
            案件詳情
          </h2>


          <button
            id="closeDetailButton"
            class="close-button"
            type="button"
            aria-label="關閉案件詳情"
            data-i18n-aria-label="common.close"
          >
            ×
          </button>

        </div>


        <div id="repairDetailContent"></div>

      </div>

    </div>

  </main>


  <!-- =================================
       工程師維修更新視窗
  ================================== -->

  <div
    id="engineerUpdateModal"
    class="modal"
    style="display: none;"
  >

    <div class="modal-overlay"></div>


    <div class="modal-content">

      <div class="modal-header">

        <h2
          id="engineerModalTitle"
          data-i18n="engineer.update"
        >
          更新維修進度
        </h2>


        <button
          id="closeEngineerModalButton"
          class="close-button"
          type="button"
          aria-label="關閉維修更新視窗"
          data-i18n-aria-label="common.close"
        >
          ×
        </button>

      </div>


      <div id="engineerCaseSummary"></div>


      <form id="engineerUpdateForm">

        <input
          id="engineerRecordId"
          type="hidden"
        >


        <label for="engineerStatus">

          <span data-i18n="fields.status">
            處理狀態
          </span>

          *

        </label>


        <select
          id="engineerStatus"
          required
        >

          <option
            value="已指派工程師"
            data-status-key="assigned"
          >
            已指派工程師
          </option>

          <option
            value="維修中"
            data-status-key="inProgress"
          >
            維修中
          </option>

          <option
            value="無法維修"
            data-status-key="unrepairable"
          >
            無法維修
          </option>

          <option
            value="已完成"
            data-status-key="completed"
          >
            已完成
          </option>

        </select>


        <label for="engineerExpectedDate">

          <span data-i18n="fields.expectedCompletionDate">
            預計完成日期
          </span>

        </label>


        <input
          id="engineerExpectedDate"
          type="date"
        >


        <label for="engineerActualDate">

          <span data-i18n="fields.actualCompletionDate">
            實際完成日期
          </span>

        </label>


        <input
          id="engineerActualDate"
          type="date"
        >


        <label
          for="engineerResult"
          data-i18n="engineer.maintenanceProgress"
        >
          維修進度／維修結果
        </label>


        <textarea
          id="engineerResult"
          placeholder="例如：已完成初步檢查，等待更換零件"
          data-i18n-placeholder="engineer.resultPlaceholder"
        ></textarea>


        <button
          id="engineerUpdateButton"
          class="primary-button"
          type="submit"
          data-i18n="engineer.update"
        >
          更新維修進度
        </button>

      </form>

    </div>

  </div>


  <!-- =================================
       JavaScript
  ================================== -->

  <script>
    window.appJsStarted = false;
  </script>


  <!-- 語系檔必須放在 app.js 前面 -->

  <script src="/i18n.js"></script>


  <script src="/app.js"></script>


  <!-- app.js 啟動診斷 -->

  <script>

    setTimeout(
      () => {

        if (
          !window.appJsStarted
        ) {

          const loading =
            document.getElementById(
              "userLoading"
            );


          if (loading) {

            loading.innerHTML =
              "❌ app.js 沒有正常啟動<br><br>" +
              "請檢查 JavaScript 語法錯誤";
          }
        }

      },
      3000
    );

  </script>

</body>

</html>
