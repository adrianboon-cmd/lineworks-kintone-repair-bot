<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>設備報修</title>

  <link rel="stylesheet" href="/style.css">

  <!-- LINE WORKS WOFF SDK -->
  <script
    charset="utf-8"
    src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js">
  </script>
</head>

<body>

  <main>

    <!-- =================================
         頁首
    ================================== -->

    <header class="app-header">

      <h1>🔧 設備報修</h1>

      <p>
        LINE WORKS × kintone
      </p>

    </header>


    <!-- =================================
         LINE WORKS 使用者資訊
    ================================== -->

    <section id="userSection">

      <div id="userLoading">
        正在取得 LINE WORKS 使用者資訊...
      </div>

      <div
        id="userInfo"
        style="display: none;"
      >
        👤
        <strong id="displayUserName"></strong>
      </div>

      <div
        id="userError"
        style="display: none;"
      >
      </div>

    </section>


    <!-- =================================
         功能切換
    ================================== -->

<nav
  id="navigation"
  class="navigation"
  style="display: none;"
>

  <button
    id="createViewButton"
    class="navigation-button active"
    type="button"
  >
    🔧 我要報修
  </button>

  <button
    id="myRepairsViewButton"
    class="navigation-button"
    type="button"
  >
    🔍 我的案件
  </button>

  <button
    id="engineerViewButton"
    class="navigation-button"
    type="button"
  >
    👨‍🔧 維修任務
  </button>

</nav>


    <!-- =================================
         建立報修頁面
    ================================== -->

    <section
      id="createRepairView"
      class="view-section"
    >

      <div class="section-heading">

        <h2>建立報修</h2>

        <p>
          請填寫設備故障資訊
        </p>

      </div>


      <form id="repairForm">

        <label for="equipmentCategory">
          設備類別 *
        </label>

        <input
          id="equipmentCategory"
          name="equipmentCategory"
          type="text"
          placeholder="例如：複合機、空調、電腦"
          required
        >


        <label for="equipmentNumber">
          設備編號
        </label>

        <input
          id="equipmentNumber"
          name="equipmentNumber"
          type="text"
          placeholder="例如：MFP-001"
        >


        <label for="equipmentName">
          設備名稱 *
        </label>

        <input
          id="equipmentName"
          name="equipmentName"
          type="text"
          placeholder="例如：Apeos C3570"
          required
        >


        <label for="location">
          所在位置 *
        </label>

        <input
          id="location"
          name="location"
          type="text"
          placeholder="例如：3F 業務部"
          required
        >


        <label for="description">
          故障描述 *
        </label>

        <textarea
          id="description"
          name="description"
          placeholder="請描述故障狀況，例如：列印時持續卡紙"
          required
        ></textarea>


        <label for="images">
          故障照片
        </label>

        <input
          id="images"
          name="images"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          capture="environment"
          multiple
        >

        <small class="field-note">
          最多 3 張，每張最大 10 MB
        </small>


        <div id="imagePreview"></div>


        <button
          id="submitButton"
          class="primary-button"
          type="submit"
          disabled
        >
          LINE WORKS 登入確認中...
        </button>

      </form>

    </section>


    <!-- =================================
         我的報修案件頁面
    ================================== -->

    <section
      id="myRepairsView"
      class="view-section"
      style="display: none;"
    >

      <div class="section-heading section-heading-row">

        <div>
          <h2>我的報修案件</h2>

          <p>
            查詢您所提出的設備報修
          </p>
        </div>

        <button
          id="refreshRepairsButton"
          class="refresh-button"
          type="button"
        >
          ↻ 重新整理
        </button>

      </div>


      <!-- 查詢中 -->

      <div
        id="repairsLoading"
        class="state-message"
        style="display: none;"
      >
        正在查詢報修案件...
      </div>


      <!-- 查詢錯誤 -->

      <div
        id="repairsError"
        class="state-message error-message"
        style="display: none;"
      >
      </div>


      <!-- 沒有案件 -->

      <div
        id="repairsEmpty"
        class="state-message empty-message"
        style="display: none;"
      >
        <div class="empty-icon">
          📭
        </div>

        <strong>
          目前沒有報修案件
        </strong>

        <p>
          若設備發生問題，可以點選「我要報修」建立案件。
        </p>
      </div>


      <!-- 案件清單 -->

      <div id="repairsList"></div>

    </section>

<!-- =================================
     我的維修任務頁面
================================== -->

<section
  id="engineerView"
  class="view-section"
  style="display: none;"
>

  <div class="section-heading section-heading-row">

    <div>
      <h2>我的維修任務</h2>

      <p>
        查看並更新指派給您的維修案件
      </p>
    </div>

    <button
      id="refreshEngineerButton"
      class="refresh-button"
      type="button"
    >
      ↻ 重新整理
    </button>

  </div>


  <div
    id="engineerLoading"
    class="state-message"
    style="display: none;"
  >
    正在查詢維修任務...
  </div>


  <div
    id="engineerError"
    class="state-message error-message"
    style="display: none;"
  >
  </div>


  <div
    id="engineerEmpty"
    class="state-message empty-message"
    style="display: none;"
  >

    <div class="empty-icon">
      🧰
    </div>

    <strong>
      目前沒有指派給您的維修案件
    </strong>

    <p>
      kintone 指派案件後，任務會顯示在這裡。
    </p>

  </div>


  <div id="engineerRepairsList"></div>

</section>
    <!-- =================================
         案件詳細資料視窗
    ================================== -->

    <div
      id="repairDetailModal"
      class="modal"
      style="display: none;"
    >

      <div class="modal-overlay"></div>

      <div class="modal-content">

        <div class="modal-header">

          <h2 id="detailTitle">
            案件詳情
          </h2>

          <button
            id="closeDetailButton"
            class="close-button"
            type="button"
            aria-label="關閉案件詳情"
          >
            ×
          </button>

        </div>


        <div id="repairDetailContent"></div>

      </div>

    </div>

  </main>

<!-- =================================
     工程師維修更新視窗
================================== -->

<div
  id="engineerUpdateModal"
  class="modal"
  style="display: none;"
>

  <div class="modal-overlay"></div>

  <div class="modal-content">

    <div class="modal-header">

      <h2 id="engineerModalTitle">
        更新維修進度
      </h2>

      <button
        id="closeEngineerModalButton"
        class="close-button"
        type="button"
        aria-label="關閉維修更新視窗"
      >
        ×
      </button>

    </div>


    <div id="engineerCaseSummary"></div>


    <form id="engineerUpdateForm">

      <input
        id="engineerRecordId"
        type="hidden"
      >


      <label for="engineerStatus">
        處理狀態 *
      </label>

      <select
        id="engineerStatus"
        required
      >
        <option value="已指派工程師">
          已指派工程師
        </option>

        <option value="維修中">
          維修中
        </option>

        <option value="無法維修">
          無法維修
        </option>

        <option value="已完成">
          已完成
        </option>
      </select>


      <label for="engineerExpectedDate">
        預計完成日期
      </label>

      <input
        id="engineerExpectedDate"
        type="date"
      >


      <label for="engineerActualDate">
        實際完成日期
      </label>

      <input
        id="engineerActualDate"
        type="date"
      >


      <label for="engineerResult">
        維修進度／維修結果
      </label>

      <textarea
        id="engineerResult"
        placeholder="例如：已完成初步檢查，等待更換零件"
      ></textarea>


      <button
        id="engineerUpdateButton"
        class="primary-button"
        type="submit"
      >
        更新維修進度
      </button>

    </form>

  </div>

</div>
  
  <script src="/app.js"></script>

</body>

</html>
